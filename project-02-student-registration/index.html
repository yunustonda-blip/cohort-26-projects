<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP</title>
</head>
<body>
    <header>
        <nav>
            <a href="../project-01-personal-gallery/index.html">HOME</a>
            <a href="../project-01-personal-gallery/about.html">ABOUT</a>
            <a href="../project-01-personal-gallery/favourites.html">GALLERY</a>
            <a href="./index.html">SIGN UP</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Welcome To The Coders Club</h1>
            <p>Thanks for joining us for the exciting hands-on learning experience</p>
            <form action="">
                <label for="fname">Enter Full Name:</label>
                <input type="text" name="" id="fname"><br>

                <label for="email">Enter Email:</label>
                <input type="email" name="" id="email"><br>

                <label for="unit">Select Your CourseUnit:</label>
                <select name="" id="unit">
                    <option value="">BIT</option>
                    <option value="">BCS</option>
                    <option value="">LLB</option>
                    <option value="">MEDICINE</option>
                </select><br>

                <fieldset>
                    <legend>Select Area Of Technology interest</legend>
                    <input type="radio" name="area" id="web">
                    <label for="web">Web Development</label><br>

                    <input type="radio" name="area" id="app">
                    <label for="app">Mobile App Development</label><br>

                    <input type="radio" name="area" id="cyber">
                    <label for="cyber">CyberSecurity</label><br>

                    <input type="radio" name="area" id="art">
                    <label for="art">Artificial Intelligence</label><br>

                    <input type="checkbox" name="" id="confirm">
                    <label for="confirm">I confirm that the information provided is correct</label><br>

                    <input type="submit" name="" id="" value="Register Now">
                </fieldset>
            </form>
        </section>
    </main>
    <footer></footer>
</body>
</html>
